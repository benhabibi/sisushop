<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سیسوشاپ</title>
<style>
:root{--bg:#faf7f5;--fg:#222;--card:#fff;--ac:#b5446e;--bd:#e6dfdb}
@media(prefers-color-scheme:dark){:root{--bg:#151314;--fg:#eee;--card:#211e1f;--bd:#3a3436}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Tahoma,Vazirmatn,sans-serif;line-height:1.6}
header{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--bd);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;z-index:5}
h1{font-size:18px;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:8px 14px;cursor:pointer}
.btn.o{background:none;color:var(--ac);border:1px solid var(--ac)}
.btn:disabled{opacity:.4}
input,select,textarea{width:100%;padding:9px;margin:4px 0 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card)}
.cats{display:flex;gap:8px;overflow-x:auto;padding:12px 16px}
.chip{white-space:nowrap;border:1px solid var(--bd);background:var(--card);border-radius:20px;padding:6px 14px;cursor:pointer}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:0 16px 24px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.card img{width:100%;aspect-ratio:3/4;object-fit:cover;background:var(--bd)}
.card div{padding:10px;display:flex;flex-direction:column;gap:4px;flex:1}
.card select{margin:0}
.price{color:var(--ac);font-weight:bold}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10;overflow:auto}
.box{background:var(--card);max-width:520px;margin:20px auto;border-radius:14px;padding:16px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd)}
.wrap{max-width:720px;margin:0 auto;padding:16px}
.sec{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.sm{font-size:13px;opacity:.7}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const CFG={
  url:'https://xeymzlwrufgtdfudcrlf.supabase.co',
  key:'sb_publishable_XJazgXNgc7jZCP6bIcD09g_poId95_Z',
  shop:'سیسوشاپ',
  card:'6037-7015-8544-7839',
  owner:'مبینا برومند'
};
const CATS=['هودی','سویشرت','بافت و پلیور و ژاکت','مانتو','بلوز و شومیز','تیشرت','دامن','پیراهن و لباس مجلسی','تاپ و نیم تنه'];
const sb=supabase.createClient(CFG.url,CFG.key);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).trim();
const stLabel=s=>({pending:'در انتظار بررسی رسید',confirmed:'تأیید شد و در حال آماده‌سازی',shipped:'ارسال شد',rejected:'رد شد، با شما تماس می‌گیریم'}[s]||s);
const fmt=n=>Number(n).toLocaleString('fa-IR')+' تومان';
let products=[],cart=[],cat='همه';

async function upload(bucket,file){
  const ext=(file.name.split('.').pop()||'jpg').toLowerCase();
  const path=Date.now()+'-'+Math.random().toString(36).slice(2)+'.'+ext;
  const {error}=await sb.storage.from(bucket).upload(path,file);
  if(error) throw error;
  return sb.storage.from(bucket).getPublicUrl(path).data.publicUrl;
}

/* ---------- Shop ---------- */
async function loadShop(){
  const {data}=await sb.from('products').select('*').eq('active',true).order('id',{ascending:false});
  products=data||[];
  drawShop();
}
function drawShop(){
  const list=products.filter(p=>cat==='همه'||p.category===cat);
  const cnt=cart.reduce((a,c)=>a+c.qty,0);
  $('#app').innerHTML=`
  <header><h1>${esc(CFG.shop)}</h1><div><button class="btn o" onclick="openTrack()">پیگیری سفارش</button> <button class="btn" onclick="openCart()">سبد خرید (${cnt.toLocaleString('fa-IR')})</button></div></header>
  <div class="cats">${['همه',...CATS].map(c=>`<span class="chip ${c===cat?'on':''}" onclick="setCat('${c}')">${c}</span>`).join('')}</div>
  <div class="grid">${list.map(p=>{
    const sizes=(p.sizes||'').split(',').map(s=>s.trim()).filter(Boolean);
    return `<div class="card"><img src="${esc(p.image_url)}" alt="">
    <div><b>${esc(p.name)}</b><span class="price">${fmt(p.price)}</span>
    ${sizes.length?`<select id="s${p.id}">${sizes.map(s=>`<option>${esc(s)}</option>`).join('')}</select>`:''}
    ${p.stock>0?`<button class="btn" onclick="addCart(${p.id})">افزودن به سبد</button>`:`<button class="btn" disabled>ناموجود</button>`}
    </div></div>`}).join('')||'<p style="padding:16px">محصولی در این دسته نیست.</p>'}</div>
  <div class="modal" id="cart"><div class="box" id="cartBox"></div></div>
  <div class="modal" id="trk"><div class="box" id="trkBox"></div></div>`;
}
function setCat(c){cat=c;drawShop()}
function addCart(id){
  const p=products.find(x=>x.id===id);
  const size=($('#s'+id)||{}).value||'';
  const ex=cart.find(c=>c.id===id&&c.size===size);
  const inCart=cart.filter(c=>c.id===id).reduce((a,c)=>a+c.qty,0);
  if(inCart>=p.stock){alert('موجودی بیشتر نیست');return}
  if(ex)ex.qty++;else cart.push({id,size,qty:1});
  drawShop();
}
function total(){return cart.reduce((a,c)=>a+products.find(p=>p.id===c.id).price*c.qty,0)}
function openCart(){
  $('#cart').style.display='block';
  if(!cart.length){$('#cartBox').innerHTML='<p>سبد خرید خالیه.</p><button class="btn o" onclick="closeCart()">بستن</button>';return}
  $('#cartBox').innerHTML=`<h3>سبد خرید</h3>
  ${cart.map((c,i)=>{const p=products.find(x=>x.id===c.id);return `<div class="row"><span>${esc(p.name)} ${c.size?'('+esc(c.size)+')':''}</span><span><button class="btn o" onclick="chg(${i},-1)">−</button> ${c.qty.toLocaleString('fa-IR')} <button class="btn o" onclick="chg(${i},1)">+</button> <button class="btn o" onclick="rmCart(${i})">حذف</button></span></div>`}).join('')}
  <p><b>جمع: ${fmt(total())}</b></p>
  <div class="sec">مبلغ رو به کارت <b dir="ltr">${esc(CFG.card)}</b> به نام <b>${esc(CFG.owner)}</b> واریز کن و بعد عکس رسید رو همین پایین بفرست.</div>
  <label>نام و نام خانوادگی</label><input id="fn">
  <label>شماره تماس</label><input id="fp" type="tel" dir="ltr">
  <label>آدرس کامل</label><textarea id="fa" rows="3"></textarea>
  <label>عکس رسید واریز</label><input id="fr" type="file" accept="image/*">
  <button class="btn" id="sendBtn" onclick="sendOrder()">ثبت سفارش</button>
  <button class="btn o" onclick="closeCart()">بستن</button>`;
}
function openTrack(){
  $('#trk').style.display='block';
  $('#trkBox').innerHTML=`<h3>پیگیری سفارش</h3>
  <label>کد پیگیری</label><input id="tc" dir="ltr" placeholder="S1A2B3C">
  <label>شماره تماس</label><input id="tp" type="tel" dir="ltr">
  <div id="tr"></div>
  <button class="btn" onclick="doTrack()">بررسی</button>
  <button class="btn o" onclick="$('#trk').style.display='none'">بستن</button>`;
}
async function doTrack(){
  const {data,error}=await sb.rpc('track_order',{p_code:norm($('#tc').value),p_phone:norm($('#tp').value)});
  const o=data&&data[0];
  $('#tr').innerHTML=error||!o?'<p>سفارشی با این مشخصات پیدا نشد.</p>':
  `<div class="sec"><b>وضعیت: ${stLabel(o.status)}</b><br>${(o.items||[]).map(i=>esc(i.name)+(i.size?' '+esc(i.size):'')+' ×'+i.qty).join('، ')}<br>${fmt(o.total)}</div>`;
}
function closeCart(){$('#cart').style.display='none'}
function chg(i,d){
  const c=cart[i],p=products.find(x=>x.id===c.id);
  const inCart=cart.filter(x=>x.id===c.id).reduce((a,x)=>a+x.qty,0);
  if(d>0&&inCart>=p.stock){alert('موجودی بیشتر نیست');return}
  c.qty+=d;
  if(c.qty<=0)cart.splice(i,1);
  drawShop();openCart();
}
function rmCart(i){cart.splice(i,1);drawShop();openCart()}
async function sendOrder(){
  const name=$('#fn').value.trim(),phone=norm($('#fp').value),addr=$('#fa').value.trim(),f=$('#fr').files[0];
  if(!name||!phone||!addr||!f){alert('همه فیلدها و عکس رسید لازمه');return}
  const btn=$('#sendBtn');btn.disabled=true;btn.textContent='در حال ارسال...';
  try{
    const receipt=await upload('receipts',f);
    const items=cart.map(c=>({id:c.id,name:products.find(p=>p.id===c.id).name,size:c.size,qty:c.qty}));
    const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let code='S';for(let k=0;k<6;k++)code+=A[Math.floor(Math.random()*A.length)];
    const {error}=await sb.from('orders').insert({name,phone,address:addr,items,total:total(),receipt_url:receipt,code});
    if(error)throw error;
    cart=[];drawShop();
    alert('سفارش ثبت شد.\nکد پیگیری شما: '+code+'\nاین کد رو یادداشت کن؛ با کد و شماره تماس می‌تونی وضعیت سفارش رو ببینی.');
  }catch(e){alert('خطا: '+(e.message||e));btn.disabled=false;btn.textContent='ثبت سفارش'}
}

/* ---------- Admin ---------- */
async function adminInit(){
  const {data:{session}}=await sb.auth.getSession();
  session?loadAdmin():drawLogin();
}
function drawLogin(){
  $('#app').innerHTML=`<div class="wrap"><div class="sec"><h3>ورود مدیر</h3>
  <input id="em" type="email" placeholder="ایمیل" dir="ltr"><input id="pw" type="password" placeholder="رمز عبور" dir="ltr">
  <button class="btn" onclick="login()">ورود</button></div></div>`;
}
async function login(){
  const {error}=await sb.auth.signInWithPassword({email:$('#em').value,password:$('#pw').value});
  error?alert('ورود ناموفق'):loadAdmin();
}
async function loadAdmin(){
  const [p,o]=await Promise.all([
    sb.from('products').select('*').order('id',{ascending:false}),
    sb.from('orders').select('*').order('id',{ascending:false})
  ]);
  products=p.data||[];const orders=o.data||[];
  $('#app').innerHTML=`<div class="wrap">
  <div class="row"><h2>پنل مدیریت</h2><button class="btn o" onclick="sb.auth.signOut().then(drawLogin)">خروج</button></div>
  <div class="sec"><h3>افزودن محصول</h3>
    <input id="pn" placeholder="نام محصول">
    <select id="pc">${CATS.map(c=>`<option>${c}</option>`).join('')}</select>
    <input id="pp" type="number" placeholder="قیمت (تومان)">
    <input id="ps" placeholder="سایزها با کاما، مثلا: S,M,L">
    <input id="pk" type="number" placeholder="موجودی">
    <input id="pi" type="file" accept="image/*">
    <button class="btn" id="addBtn" onclick="addProduct()">افزودن</button></div>
  <div class="sec"><h3>سفارش‌ها</h3>${orders.map(o=>`<div class="row" style="flex-wrap:wrap">
    <div><b>${esc(o.name)}</b> <span class="sm" dir="ltr">${esc(o.phone)}</span> <span class="sm" dir="ltr">${esc(o.code)}</span><br>
    ${(o.items||[]).map(i=>esc(i.name)+(i.size?' '+esc(i.size):'')+' ×'+i.qty).join('، ')}<br>
    <span class="sm">${esc(o.address)}</span><br>${fmt(o.total)} — وضعیت: <b>${stLabel(o.status)}</b>
    <br><a href="${esc(o.receipt_url)}" target="_blank">مشاهده رسید</a></div>
    ${o.status==='pending'?`<div><button class="btn" onclick="setOrder(${o.id},'confirmed')">تأیید</button> <button class="btn o" onclick="setOrder(${o.id},'rejected')">رد</button></div>`:o.status==='confirmed'?`<div><button class="btn" onclick="setOrder(${o.id},'shipped')">ارسال شد</button></div>`:''}
  </div>`).join('')||'<p>سفارشی نیست.</p>'}</div>
  <div class="sec"><h3>محصولات</h3>${products.map(p=>`<div class="row"><span>${esc(p.name)} <span class="sm">(${esc(p.category)})</span></span>
    <span><input type="number" value="${p.stock}" style="width:70px;display:inline;margin:0" onchange="setStock(${p.id},this.value)">
    <button class="btn o" onclick="delProduct(${p.id})">حذف</button></span></div>`).join('')}</div></div>`;
}
async function addProduct(){
  const f=$('#pi').files[0],name=$('#pn').value.trim(),price=+$('#pp').value;
  if(!name||!price||!f){alert('نام، قیمت و عکس لازمه');return}
  $('#addBtn').disabled=true;
  try{
    const image_url=await upload('products',f);
    const {error}=await sb.from('products').insert({name,category:$('#pc').value,price,sizes:$('#ps').value,stock:+$('#pk').value||0,image_url});
    if(error)throw error;
    loadAdmin();
  }catch(e){alert('خطا: '+(e.message||e));$('#addBtn').disabled=false}
}
async function setStock(id,v){await sb.from('products').update({stock:+v}).eq('id',id)}
async function delProduct(id){if(confirm('حذف شود؟')){await sb.from('products').delete().eq('id',id);loadAdmin()}}
async function setOrder(id,status){
  if(status==='confirmed'){
    const {data:o}=await sb.from('orders').select('items').eq('id',id).single();
    for(const i of o.items){
      const {data:p}=await sb.from('products').select('stock').eq('id',i.id).single();
      if(p)await sb.from('products').update({stock:Math.max(0,p.stock-i.qty)}).eq('id',i.id);
    }
  }
  await sb.from('orders').update({status}).eq('id',id);
  loadAdmin();
}

location.hash==='#admin'?adminInit():loadShop();
window.addEventListener('hashchange',()=>location.reload());
</script>
</body>
</html>
